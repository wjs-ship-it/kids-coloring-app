<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFF8E9">
<link rel="manifest" href="./manifest.json">
<title>키즈 컬러링</title>
<style>
:root{
  --bg:#FFF8E9;--paper:#FFFDF8;--ink:#493A35;--sub:#806D64;
  --coral:#FF8B70;--coral-deep:#E96C52;
  --yellow:#FFD86B;--yellow-deep:#E6B949;
  --mint:#A7E2CF;--mint-deep:#68B89E;
  --lav:#C9B8F0;--lav-deep:#9A83CF;
  --line:rgba(73,58,53,.1);
  --shadow:0 14px 34px rgba(92,66,48,.13);
  --press:0 7px 0 rgba(73,58,53,.12),0 14px 22px rgba(73,58,53,.08);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;
  font-family:"Arial Rounded MT Bold","NanumSquareRound","Pretendard","Apple SD Gothic Neo",sans-serif;
  color:var(--ink);
  background:linear-gradient(180deg,#FFF9EC,#FFF6E4);
}
canvas{touch-action:none}
button{touch-action:manipulation;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent;font:inherit}
.screen{display:none;width:100%;height:100%;position:absolute;inset:0;overflow-x:hidden;overflow-y:auto}
.screen.active{display:flex;flex-direction:column;align-items:center}

/* Doodles */
.doodle{position:absolute;z-index:0;pointer-events:none;opacity:.8}
.d-star{top:6%;left:4%;width:68px;transform:rotate(-15deg)}
.d-rainbow{top:20%;right:-10px;width:62px;transform:rotate(14deg)}
.d-blob{bottom:22%;left:-6px;width:56px}
.d-spark{bottom:10%;right:6px;width:56px}

/* ═══ Upload ═══ */
#upload-screen{
  background:
    radial-gradient(circle at 10% 7%,rgba(255,216,107,.24) 0 110px,transparent 111px),
    radial-gradient(circle at 92% 15%,rgba(201,184,240,.21) 0 120px,transparent 121px),
    linear-gradient(180deg,#FFF9EC,#FFF6E4);
  justify-content:flex-start;
  padding:max(20px,env(safe-area-inset-top)) 18px 40px;
}
.hero-section{text-align:center;padding:20px 0 0;position:relative;z-index:1}
.mini-badge{
  display:inline-flex;align-items:center;gap:7px;
  padding:7px 13px;border-radius:999px;
  background:#FFF1B9;color:#836423;
  border:1px solid rgba(230,185,73,.25);
  box-shadow:0 7px 16px rgba(124,91,26,.08);
  font-size:12px;font-weight:900;
}
.app-title{margin:10px 0 0;font-size:clamp(34px,10vw,44px);font-weight:900;line-height:1.08;letter-spacing:-2px}
.app-subtitle{margin:8px auto 0;max-width:340px;color:var(--sub);font-size:14px;line-height:1.55;font-weight:800}

.magic-zone{
  position:relative;margin:18px auto 0;width:100%;max-width:390px;
  padding:18px 16px 16px;border-radius:34px;
  background:linear-gradient(145deg,#FFE6A6,#FFD17B);
  border:2px solid rgba(255,255,255,.75);
  box-shadow:var(--shadow);overflow:hidden;z-index:1;
  flex-shrink:0;
}
.cloud-svg{position:absolute;opacity:.55;pointer-events:none}
.cloud-1{left:12px;top:18px;width:70px}
.cloud-2{right:8px;bottom:26px;width:86px}
.camera-wrap{position:relative;display:grid;place-items:center;width:200px;height:150px;margin:0 auto 6px}
.camera-svg{width:170px;filter:drop-shadow(0 13px 10px rgba(102,66,40,.15));animation:float 2.8s ease-in-out infinite}
.spark-svg{position:absolute;animation:twinkle 1.8s ease-in-out infinite}
.spark-1{top:5px;right:7px;width:28px}
.spark-2{left:5px;bottom:15px;width:21px;animation-delay:.5s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes twinkle{0%,100%{transform:scale(.8) rotate(0);opacity:.45}50%{transform:scale(1.15) rotate(12deg);opacity:1}}

.upload-btn{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;min-height:56px;border-radius:22px;
  background:#FFF;color:#9B4C39;font-size:18px;font-weight:900;
  box-shadow:0 7px 0 #F4C9A7,0 13px 20px rgba(120,78,42,.13);
  transition:.18s ease;
}
.upload-btn:active{transform:translateY(5px);box-shadow:0 2px 0 #F4C9A7,0 7px 12px rgba(120,78,42,.11)}
.upload-btn svg{width:24px;height:24px}
#photo-input{display:none}

.type-area{margin:14px auto 0;max-width:350px;width:100%}
.type-label{margin:0 0 7px;text-align:left;font-size:12px;color:#8A7469;font-weight:900}
.toggle-wrap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:6px;border-radius:23px;background:#F2E5D0;box-shadow:inset 0 2px 8px rgba(73,58,53,.06)}
.mtbtn{min-height:48px;border-radius:18px;background:transparent;color:#735F56;font-size:15px;font-weight:900;transition:.18s ease}
.mtbtn.active{background:var(--coral);color:#FFF;box-shadow:0 5px 0 var(--coral-deep),0 10px 16px rgba(233,108,82,.2);transform:translateY(-2px)}
.type-note{margin:10px 4px 0;text-align:left;font-size:12px;line-height:1.45;color:#8A7469;font-weight:800}

.section-title-row{display:flex;align-items:end;justify-content:space-between;margin:24px 4px 10px;width:100%;max-width:390px;position:relative;z-index:1}
.section-title-row h2{margin:0;font-size:20px;letter-spacing:-.7px}
.section-title-row span{font-size:11px;color:#8A766C;font-weight:800}

.home-modes{display:grid;gap:10px;width:100%;max-width:390px;position:relative;z-index:1}
.home-mode-card{
  position:relative;display:grid;grid-template-columns:52px 1fr 16px;
  align-items:center;gap:11px;min-height:82px;padding:12px 14px;
  border-radius:26px;text-align:left;color:var(--ink);
  box-shadow:var(--press);cursor:pointer;overflow:hidden;transition:.18s ease;
}
.home-mode-card:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(73,58,53,.12),0 7px 12px rgba(73,58,53,.08)}
.home-mode-card.yellow{background:#FFF0A8}
.home-mode-card.mint{background:#BDEAD9}
.home-mode-card.lav{background:#DCCFF5}
.home-mode-card::after{content:"";position:absolute;width:70px;height:70px;border-radius:50%;right:-22px;top:-18px;background:rgba(255,255,255,.25)}
.hm-icon{width:52px;height:52px;display:grid;place-items:center;border-radius:17px;background:rgba(255,255,255,.72);box-shadow:inset 0 1px 0 rgba(255,255,255,.95);font-size:28px}
.home-mode-card strong{display:block;font-size:17px;letter-spacing:-.4px}
.home-mode-card small{display:block;margin-top:3px;color:#745F55;font-size:11px;line-height:1.35;font-weight:800}
.chev{width:9px;height:9px;border-top:3px solid currentColor;border-right:3px solid currentColor;transform:rotate(45deg);opacity:.4}

.howto{margin:22px auto 0;padding:14px;border-radius:26px;background:rgba(255,255,255,.76);border:1px solid rgba(255,255,255,.95);box-shadow:0 10px 24px rgba(73,58,53,.08);width:100%;max-width:390px;position:relative;z-index:1}
.howto h3{margin:0 0 10px;font-size:16px;letter-spacing:-.4px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.step{text-align:center;padding:10px 5px;border-radius:17px;background:#FFF9F0;border:1px solid var(--line)}
.step-num{width:24px;height:24px;display:grid;place-items:center;margin:0 auto 6px;border-radius:50%;background:#FF9C82;color:#FFF;font-size:11px;font-weight:900}
.step b{display:block;font-size:12px}
.step span{display:block;margin-top:3px;color:#8A766C;font-size:10px;line-height:1.35;font-weight:700}

/* ═══ Processing ═══ */
#processing-screen{background:linear-gradient(180deg,#FFF9EC,#FFF6E4);gap:24px;justify-content:center}
.loading-anim{font-size:80px;animation:bounce .6s ease-in-out infinite alternate}
@keyframes bounce{from{transform:scale(1)}to{transform:scale(1.2)}}
.loading-text{font-size:22px;font-weight:800;color:var(--coral-deep)}

/* ═══ Preview ═══ */
#preview-screen{background:linear-gradient(180deg,#FFF9EC,#FFF6E4);gap:16px;padding:28px 20px;justify-content:center}
.preview-box{display:flex;gap:12px;align-items:center;background:#FFF;padding:16px;border-radius:28px;box-shadow:var(--shadow)}
.preview-box img,.preview-box canvas{width:120px;height:120px;object-fit:contain;border-radius:16px}
.preview-arrow{font-size:36px;color:var(--coral)}
.detail-slider-wrap{width:100%;max-width:320px;display:flex;flex-direction:column;align-items:center;gap:6px;background:rgba(255,255,255,.85);padding:14px 20px;border-radius:22px;box-shadow:0 6px 18px rgba(73,58,53,.06)}
.detail-label{font-size:15px;font-weight:800;color:var(--coral-deep)}
.detail-range{-webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:5px;background:linear-gradient(90deg,#F2E5D0,var(--coral));outline:none}
.detail-range::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#FFF;border:3px solid var(--coral);box-shadow:0 2px 8px rgba(0,0,0,.15);cursor:pointer}
.detail-range::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#FFF;border:3px solid var(--coral);box-shadow:0 2px 8px rgba(0,0,0,.15);cursor:pointer}
.detail-ends{display:flex;justify-content:space-between;width:100%;font-size:12px;font-weight:700;color:#8A766C}
.detail-slider-wrap.processing{opacity:.5;pointer-events:none}
.start-btn{width:100%;max-width:320px;min-height:62px;border-radius:23px;background:var(--coral);color:#FFF;font-size:20px;font-weight:900;box-shadow:0 7px 0 var(--coral-deep),0 14px 24px rgba(233,108,82,.24);transition:.18s ease;display:flex;align-items:center;justify-content:center;gap:8px}
.start-btn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--coral-deep),0 7px 13px rgba(233,108,82,.2)}
.start-btn .si{font-size:28px}
.back-pill{padding:12px 28px;border-radius:50px;background:rgba(73,58,53,.08);color:var(--sub);font-size:15px;font-weight:800;margin-top:4px}
.back-pill:active{transform:scale(.92)}

/* ═══ Mode ═══ */
#mode-screen{background:linear-gradient(180deg,#FFF9EC,#FFF6E4);gap:16px;padding:32px 20px;justify-content:center}
.mode-title{font-size:28px;font-weight:900;letter-spacing:-1px}
.mode-grid{display:grid;gap:12px;max-width:380px;width:100%}
.mode-card{
  position:relative;display:grid;grid-template-columns:52px 1fr;
  align-items:center;gap:12px;min-height:76px;padding:14px 18px;
  border-radius:26px;text-align:left;color:var(--ink);
  box-shadow:var(--press);cursor:pointer;overflow:hidden;transition:.18s ease;
}
.mode-card:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(73,58,53,.12),0 7px 12px rgba(73,58,53,.08)}
.mode-card:nth-child(1){background:#FFF0A8}
.mode-card:nth-child(2){background:#BDEAD9}
.mode-card:nth-child(3){background:#DCCFF5}
.mode-card:nth-child(4){background:#FFD4C8}
.mode-card:nth-child(5){background:#B8E8F8}
.mode-card::after{content:"";position:absolute;width:70px;height:70px;border-radius:50%;right:-20px;top:-18px;background:rgba(255,255,255,.25)}
.mode-card .mode-icon{width:52px;height:52px;display:grid;place-items:center;border-radius:17px;background:rgba(255,255,255,.72);box-shadow:inset 0 1px 0 rgba(255,255,255,.95);font-size:28px}
.mode-card .mode-name{font-size:17px;font-weight:900;letter-spacing:-.3px}
.mode-card.full-width{grid-column:1/-1}
.mode-back{padding:12px 28px;border-radius:50px;background:rgba(73,58,53,.08);color:var(--sub);font-size:15px;font-weight:800}
.mode-back:active{transform:scale(.92)}

/* ═══ Canvas ═══ */
#canvas-screen{position:relative;display:none!important}
#canvas-screen.active{display:block!important}
#drawing-canvas{display:block;position:absolute;top:0;left:0}
.round-btn{width:52px;height:52px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 5px 0 rgba(73,58,53,.1),0 8px 16px rgba(73,58,53,.08);transition:.18s ease;position:absolute;z-index:50}
.round-btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(73,58,53,.1)}
#btn-back{top:14px;left:14px;background:#FFD4C8}
#btn-undo{top:14px;left:76px;background:#DCCFF5}
#btn-export{top:14px;right:76px;background:#FFF0A8}
#btn-save{top:14px;right:14px;background:#BDEAD9}
.progress-wrap{position:absolute;top:76px;left:14px;right:14px;z-index:50;display:flex;align-items:center;gap:8px}
.progress-bar{flex:1;height:14px;background:#F2E5D0;border-radius:7px;overflow:hidden}
.progress-fill{height:100%;border-radius:7px;transition:width .3s;width:0;background:linear-gradient(90deg,var(--yellow),var(--coral))}
.part-label{font-size:14px;font-weight:900;color:var(--coral-deep);white-space:nowrap}
.side-palette{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:7px;z-index:50;background:rgba(255,253,248,.92);backdrop-filter:blur(8px);padding:8px 6px;border-radius:22px;box-shadow:0 8px 24px rgba(73,58,53,.1);max-height:65vh;overflow-y:auto;scrollbar-width:none;transition:opacity .3s,transform .3s}
.side-palette::-webkit-scrollbar{display:none}
.side-palette.hidden{opacity:0;transform:translateY(-50%) translateX(80px);pointer-events:none}
.cdot{width:40px;height:40px;min-height:40px;border-radius:50%;border:3px solid transparent;transition:all .15s;flex-shrink:0}
.cdot.active{border-color:var(--ink);transform:scale(1.15)}
.eraser-dot{width:40px;height:40px;min-height:40px;border-radius:50%;background:#FFF;border:3px solid #F2E5D0;display:flex;align-items:center;justify-content:center;font-size:20px;transition:all .15s;flex-shrink:0}
.eraser-dot.active{border-color:var(--ink);transform:scale(1.15)}
.brush-bar{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:50;background:rgba(255,253,248,.92);backdrop-filter:blur(8px);padding:8px 16px;border-radius:22px;box-shadow:0 6px 20px rgba(73,58,53,.1);transition:opacity .3s,transform .3s}
.brush-bar.hidden{opacity:0;transform:translateX(-50%) translateY(60px);pointer-events:none}
.brush-pick{width:44px;height:44px;border-radius:50%;background:#FFF9F0;display:flex;align-items:center;justify-content:center;transition:all .15s}
.brush-pick:active{transform:scale(.9)}
.brush-pick.active{background:#FFE6A6;box-shadow:inset 0 0 0 3px var(--yellow-deep)}
.bdot{border-radius:50%;background:var(--ink)}
.fill-tool-bar{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:50;background:rgba(255,253,248,.92);backdrop-filter:blur(8px);padding:8px 12px;border-radius:22px;box-shadow:0 6px 20px rgba(73,58,53,.1);transition:opacity .3s,transform .3s}
.fill-tool-bar.hidden{opacity:0;transform:translateX(-50%) translateY(60px);pointer-events:none}
.fill-tool-pick{min-width:62px;height:38px;padding:0 12px;border-radius:16px;background:#FFF9F0;color:var(--ink);font-size:13px;font-weight:900;letter-spacing:-.2px;transition:all .15s}
.fill-tool-pick:active{transform:scale(.96)}
.fill-tool-pick.active{background:#FFE6A6;box-shadow:inset 0 0 0 3px var(--yellow-deep)}

.hint-toast{position:absolute;top:100px;left:50%;transform:translateX(-50%);background:var(--yellow);color:#78350f;padding:10px 24px;border-radius:20px;font-size:15px;font-weight:800;z-index:60;pointer-events:none;white-space:nowrap;transition:opacity .5s;animation:hint-pulse 2s infinite;box-shadow:0 5px 0 var(--yellow-deep),0 10px 16px rgba(230,185,73,.2)}
@keyframes hint-pulse{0%,100%{opacity:1;transform:translateX(-50%) scale(1)}50%{opacity:.7;transform:translateX(-50%) scale(.96)}}

.part-done-overlay{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;pointer-events:none}
.part-done-overlay.active{display:flex}
.part-done-msg{font-size:48px;font-weight:900;color:#FFF;text-shadow:3px 3px 0 rgba(73,58,53,.2);animation:pop-in .5s ease-out}
@keyframes pop-in{0%{transform:scale(0) rotate(-20deg);opacity:0}60%{transform:scale(1.2) rotate(5deg)}100%{transform:scale(1) rotate(0deg);opacity:1}}
.stars-celebration{position:fixed;inset:0;z-index:300;pointer-events:none;display:none}
.stars-celebration.active{display:block}
.star-particle{position:absolute;animation:star-fall 1.5s ease-out forwards}
@keyframes star-fall{0%{opacity:1;transform:translateY(0) rotate(0deg) scale(1)}100%{opacity:0;transform:translateY(60vh) rotate(360deg) scale(.3)}}
.save-toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#4C3C36;color:#FFF;padding:14px 28px;border-radius:20px;font-size:17px;font-weight:800;z-index:200;display:none;box-shadow:0 12px 30px rgba(0,0,0,.17)}

/* ═══ Preset ═══ */
#preset-screen{background:var(--bg);gap:16px;padding:24px 20px max(32px,env(safe-area-inset-bottom));justify-content:flex-start}
.preset-title{font-size:26px;font-weight:900;letter-spacing:-.7px}
.preset-header{position:sticky;top:-24px;z-index:2;background:var(--bg);padding:12px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;max-width:780px}
.preset-header .demo-pill{padding:12px 18px;min-height:44px;flex-shrink:0}
.preset-filters{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:780px}
.preset-filter{min-height:44px;padding:10px 16px;border-radius:16px;background:#fff;color:var(--ink);font-size:14px;font-weight:800;border:2px solid transparent}
.preset-filter[aria-pressed="true"]{background:var(--mint);border-color:var(--mint-deep)}
.preset-filter:hover{border-color:var(--mint-deep)}
.preset-status{font-size:14px;color:var(--sub);min-height:22px;text-align:center;word-break:keep-all}
.preset-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:780px;width:100%}
.preset-card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 10px;border-radius:24px;background:#FFF;box-shadow:0 7px 0 rgba(73,58,53,.06),0 14px 22px rgba(73,58,53,.06);transition:.18s ease}
.preset-card img{width:100%;height:auto;aspect-ratio:1;object-fit:contain}
.preset-card:hover{box-shadow:0 7px 0 rgba(73,58,53,.1),0 14px 22px rgba(73,58,53,.09)}
.preset-card:disabled{opacity:.55;cursor:wait}
.preset-card:focus-visible,.preset-filter:focus-visible,.preset-header button:focus-visible{outline:3px solid var(--coral-deep);outline-offset:4px}
.preset-card .preset-name{text-align:center;word-break:keep-all}
@media(min-width:640px){.preset-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(prefers-reduced-motion:reduce){.preset-card{transition:none}}
.preset-card:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(73,58,53,.06),0 7px 12px rgba(73,58,53,.05)}
.preset-card .preset-emoji{font-size:42px}
.preset-card .preset-name{font-size:13px;font-weight:900;color:#745F55}
.demo-pill{padding:12px 28px;border-radius:50px;background:rgba(73,58,53,.08);color:var(--sub);font-size:15px;font-weight:800}
.demo-pill:active{transform:scale(.92)}
</style>
</head>
<body>

<div id="upload-screen" class="screen active">
  <svg class="doodle d-star" viewBox="0 0 100 100" aria-hidden="true"><path d="M51 8l11 26 28 3-21 18 7 28-25-14-25 14 7-28-21-18 28-3z" fill="#FFE491" stroke="#E5B84E" stroke-width="3"/></svg>
  <svg class="doodle d-rainbow" viewBox="0 0 100 70" aria-hidden="true"><path d="M5 58C28 6 70 6 95 58" fill="none" stroke="#F5A0A9" stroke-width="12" stroke-linecap="round"/><path d="M18 58C35 20 66 20 82 58" fill="none" stroke="#F4C46C" stroke-width="10" stroke-linecap="round"/><path d="M31 58C42 34 59 34 69 58" fill="none" stroke="#9FD9C3" stroke-width="9" stroke-linecap="round"/></svg>
  <svg class="doodle d-blob" viewBox="0 0 100 100" aria-hidden="true"><path d="M20 48c10-28 50-34 65-8 16 27-8 50-34 44-25-5-40-17-31-36z" fill="#C9B8F0" opacity=".55"/><circle cx="43" cy="50" r="5" fill="#9B85D0"/><circle cx="62" cy="43" r="5" fill="#9B85D0"/></svg>
  <svg class="doodle d-spark" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 8c3 22 12 31 34 34-22 3-31 12-34 34-3-22-12-31-34-34 22-3 31-12 34-34z" fill="#A7E2CF"/></svg>

  <div class="hero-section">
    <span class="mini-badge">✨ 사진 한 장이면 색칠놀이 완성</span>
    <div class="app-title">사진을 그림으로!</div>
    <p class="app-subtitle">좋아하는 사진을 골라주세요.<br>귀여운 색칠 그림으로 바꿔드려요.</p>
  </div>

  <section class="magic-zone">

        <circle cx="108" cy="91" r="8" fill="#EFFFFA"/>
        <circle cx="83" cy="81" r="6" fill="#4A3934"/><circle cx="157" cy="81" r="6" fill="#4A3934"/>

    </div>
    <button class="upload-btn" id="btn-upload">

    <div class="type-area">

  <input type="file" id="photo-input" accept="image/*">

  <div class="section-title-row">
    <h2>어떻게 놀까요?</h2>

  <div class="preset-header">
    <h1 class="preset-title">그림을 골라봐!</h1>
    <button class="demo-pill" id="btn-preset-back">돌아가기</button>
  </div>
  <nav class="preset-filters" id="preset-filters" aria-label="그림 종류"></nav>
  <p class="preset-status" id="preset-status" role="status" aria-live="polite"></p>
  <div class="preset-grid" id="preset-grid"></div>
</div>

<div id="processing-screen" class="screen">
  <div class="loading-anim">🖍️</div>
  <div class="loading-text" id="loading-text">그림으로 바꾸는 중...</div>
</div>

<div id="preview-screen" class="screen">
  <div class="preview-box">
    <img id="preview-img"><div class="preview-arrow">→</div><canvas id="lineart-preview"></canvas>
  </div>
  <div class="detail-slider-wrap" id="detail-slider-wrap">

    <input type="range" id="detail-slider" min="1" max="100" value="50" class="detail-range">

  </div>
  <button class="start-btn" id="btn-begin"><span class="si">▶️</span>시작!</button>

</div>

<div id="mode-screen" class="screen">
  <div class="mode-title">어떻게 놀까? 🎨</div>
  <div class="mode-grid">
    <button class="mode-card" data-mode="trace"><span class="mode-icon">✏️</span><span class="mode-name">따라 그리기</span></button>
    <button class="mode-card" data-mode="color"><span class="mode-icon">🎨</span><span class="mode-name">색칠하기</span></button>
    <button class="mode-card" data-mode="sketch"><span class="mode-icon">🖍️</span><span class="mode-name">자유 그리기</span></button>
    <button class="mode-card" data-mode="kaleidoscope"><span class="mode-icon">🔮</span><span class="mode-name">만화경</span></button>
    <button class="mode-card full-width" data-mode="neon"><span class="mode-icon">✨</span><span class="mode-name">네온 매직</span></button>
  </div>
  <button class="mode-back" id="btn-mode-back">↩️ 돌아가기</button>
</div>

<div id="canvas-screen" class="screen">
  <canvas id="drawing-canvas"></canvas>
  <button class="round-btn" id="btn-back">↩️</button>
  <button class="round-btn" id="btn-undo">⬅️</button>
  <button class="round-btn" id="btn-export">📤</button>
  <button class="round-btn" id="btn-save">💾</button>
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="part-label" id="part-label"></div>
  </div>
  <div class="side-palette hidden" id="side-palette"></div>
  <div class="brush-bar hidden" id="brush-bar"></div>
  <div class="fill-tool-bar hidden" id="fill-tool-bar"></div>
  <div class="hint-toast" id="hint-toast" style="display:none;"></div>
</div>

<div class="part-done-overlay" id="part-done-overlay"><div class="part-done-msg" id="part-done-msg"></div></div>
<div class="stars-celebration" id="stars-celebration"></div>
<div class="save-toast" id="save-toast">💾 저장 완료!</div>

<script type="module" src="./js/app.js"></script>
<script>
const testParams = new URLSearchParams(location.search);
const disableServiceWorker = testParams.get('no-sw') === '1';
if ('serviceWorker' in navigator) {
  if (disableServiceWorker) {
    navigator.serviceWorker.getRegistrations().then((registrations) => Promise.all(registrations.map((registration) => registration.unregister())));
  } else {
    navigator.serviceWorker.register('./sw.js', { scope: './' });
  }
}
</script>
